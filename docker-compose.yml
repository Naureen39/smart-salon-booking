services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: glowdesk
      POSTGRES_PASSWORD: glowdesk
      POSTGRES_DB: glowdesk
    ports:
      # Host-side port only — every other service in this file reaches
      # Postgres via the `postgres:5432` container hostname, so this just
      # controls what's exposed to the machine running Docker. Mapped to a
      # non-default host port since 5432 is the single most likely port to
      # already be taken by some other project's Postgres container.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glowdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://glowdesk:glowdesk@postgres:5432/glowdesk
      REDIS_URL: redis://redis:6379/0
    ports:
      # Host-side port only, same reasoning as Postgres above: 8000 is the
      # single most likely port to already be taken by some other local
      # FastAPI/Django project. The container still listens on 8000
      # internally, matching the Dockerfile and this command unchanged.
      - "8001:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://glowdesk:glowdesk@postgres:5432/glowdesk
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info

  celery_beat:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://glowdesk:glowdesk@postgres:5432/glowdesk
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build: ./frontend
    environment:
      # Must match the backend's host-published port above, not its
      # in-container port: this is read by the browser, not by another
      # container, so it needs whatever's reachable from the host machine.
      VITE_API_BASE_URL: http://localhost:8001
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
